services:
  db:
    image: postgres:17-alpine
    container_name: free-astro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the whole app in Docker with `docker compose --profile app up -d --build`
  app:
    profiles: ["app"]
    build: .
    container_name: free-astro-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://astro:astro@db:5432/astro
      KEYWORD_CACHE_TTL_HOURS: 24
    ports:
      - "3000:3000"

volumes:
  pgdata:
