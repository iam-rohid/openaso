appId: com.openaso.app
productName: OpenASO
copyright: Copyright © 2026 Rohid
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

# electron-vite bundles everything into out/; only better-sqlite3 (the sole runtime
# dependency) ships in node_modules, and its native binary must live outside the asar.
files:
  - out/**
  - package.json
  # better-sqlite3 ships SQLite's C sources and a binary for every platform; keep
  # only this target's (Node-API binaries, so they work with any Electron version).
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}).node"
asarUnpack:
  - "**/*.node"

# Migrations are applied on launch from <resources>/drizzle.
extraResources:
  - from: drizzle
    to: drizzle

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what electron-updater reads to detect new versions.
    - target: zip
      arch: [arm64, x64]
  # Signed with the Developer ID Application certificate in CSC_LINK (or the keychain) and
  # notarized when APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set; without them
  # notarization is skipped. Squirrel.Mac only installs updates into a signed app.
  hardenedRuntime: true

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# Unsigned: SmartScreen warns on first install, but updates still install. Don't set
# publisherName while it's unsigned, or the updater will reject unsigned updates.
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  synopsis: App Store keyword research and rank tracking
  maintainer: Rohid <iam-rohid@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

publish:
  provider: github
  owner: iam-rohid
  repo: openaso
  releaseType: draft
